LocalizedDescriptions_0=A simple volume adjustment. Unlike the channel volume which is applied after all channel effects, this one can be placed anywhere in the effect list.
LocalizedDescriptions_1=A simple stereo balance adjustment. Unlike the channel balance which is applied after all channel effects, this one can be placed anywhere in the effect list.
LocalizedDescriptions_2=A collection of versatile filters (low-pass, high-pass, band-pass, notch, etc) designed to selectively shape, attenuate, or emphasize specific frequency ranges of the audio signal.
LocalizedDescriptions_3=A three-band parametric equalizer with bass, mid, and treble controls, offering advanced options to adjust each band's frequency and resonance (Q) for precise tonal shaping.
LocalizedDescriptions_4=The original Freeverb by Jezar at Dreampoint. The audio community is eternally grateful for their amazing contribution.
LocalizedDescriptions_5=Cloud Seed is an algorithmic reverb plugin, designed for emulating huge, endless spaces and modulated echoes. It is powerful and flexible but considerably more complex than Freeverb. The core code is gracefully provided by Ghost Note Audio under MIT license. Please visit their website to see all their products, including a VST version of this reverb, which comes with a much nicer user interface.
LocalizedDescriptions_6=A three-phase stereo chorus effect that thickens and widens the sound, adding subtle movement, depth, and lush spatial texture.
LocalizedDescriptions_7=A flexible delay effect featuring mono, cross, and ping-pong modes, with an optional low-pass filter to smooth repeated echoes for a polished, spacious sound.
LocalizedDescriptions_8=A bit crusher effect that intentionally degrades audio by lowering bit depth and sample rate, producing gritty, lo-fi, and digitally distorted textures.
LocalizedDescriptions_9=A versatile compressor that reduces dynamic range by attenuating signals above a threshold. Features adjustable ratio, soft knee, attack/release timing and makeup gain for transparent or punchy dynamics control. Can optionally use another channel as a side-chain.
LocalizedDescriptions_10=A simple distortion effect with adjustable drive and multiple shaping modes. Focuses purely on waveshaping and clipping, leaving tone shaping and filtering to be added separately in your signal chain.
