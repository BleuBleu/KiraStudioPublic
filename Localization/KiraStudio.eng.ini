ClearUndoRedoTooltip=When enabled, the undo/redo stack will be cleared every time you save. Enabling this can help keep the memory usage down.
ReviewAfterPlayTooltip=When enabled, KiraStudio will seek back to the previous play position after stopping the song.
OpenLastTooltip=When enabled, KiraStudio will open the last project you were working on when you last closed the app.
AutosaveTooltip=When enabled, a backup copy of your project will be saved approximately every 2 minutes in the Autosave folder. This can prevent losing data when a crash occurs.
