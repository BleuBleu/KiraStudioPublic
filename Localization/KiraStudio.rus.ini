LocalizedDescriptions_0=Простая настройка громкости звука. В отличии от громкости канала, эта может быть поставлена на любое место в списке эффектов.
LocalizedDescriptions_1=Простая настройка баланса/панорамирования звука. В отличии от баланса канала, этот может быть поставлен на любое место в списке эффектов.
LocalizedDescriptions_2=Коллекция универсальных филтров (low-pass (НЧ), high-pass (ВЧ), band-pass, notch, и др.), созданных специально для ослабления или усиления некоторый частот звука.
LocalizedDescriptions_3=Трёхполосный параметрический эквалайзер с контролем бассов, мидов, и требла, а также с настройками радиусов частот и резонанса (Q) для точно тонального шейпинга.
LocalizedDescriptions_4=Оригинальный Freeverb от Jezar из Dreampoint. Аудио-сообщество никогда не забудет их невероятную контрибуцию.
LocalizedDescriptions_5=Cloud Seed is an algorithmic reverb plugin, designed for emulating huge, endless spaces and modulated echoes. It is powerful and flexible but considerably more complex than Freeverb. The core code is gracefully provided by Ghost Note Audio under MIT license. Please visit their website to see all their products, including a VST version of this reverb, which comes with a much nicer user interface. #TODO
LocalizedDescriptions_6=Трёхфазовый стерео-хорус эффект, который делает звук гуще и шире, добавляя движения, глубины и текстуры.
LocalizedDescriptions_7=Гибкий, настраиваемый дилей с моно, кросс и пинг-понг режимами, а также с НЧ-фильтром для сглаживания эха для получения проработанного, объёмного звука.
LocalizedDescriptions_8=Бит-крашер, который специально ухудшает качество аудио, снижая битовую глубину и частоту дискретизации, что создаёт грубые Lo-Fi звуки с цифровыми артефактами.
LocalizedDescriptions_9=A versatile compressor that reduces dynamic range by attenuating signals above a threshold. Features adjustable ratio, soft knee, attack/release timing and makeup gain for transparent or punchy dynamics control. Can optionally use another channel as a side-chain. #TODO
LocalizedDescriptions_10=A simple distortion effect with adjustable drive and multiple shaping modes. Focuses purely on waveshaping and clipping, leaving tone shaping and filtering to be added separately in your signal chain. #TODO
