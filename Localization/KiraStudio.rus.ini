TutorialMessages_4=(5/10) Для <f8bbd0|добавления> вещей вроде паттернов и нот, <f8bbd0|нажмите ЛКМ> по пустому пространству.
TutorialMessages_5=(6/10) Для <f8bbd0|удаления> вещей вроде паттернов и нот, <f8bbd0|дважды нажмите ЛКМ>.
TutorialMessages_6=(7/10) <f8bbd0|Нажатие ПКМ> по вещам обычное открывает <f8bbd0|контекстное меню> с дополнительными опциями. Нажимайте ПКМ по всему, что видите, чтобы узнать приложение получше!
TutorialMessages_7=(8/10) <f8bbd0|Нажатие ПКМ> по большинству ползунков с числами позволит <f8bbd0|автоматизировать их различными способами>.
TutorialMessages_8=(9/10) Всегда смотрите на <f8bbd0|подсказки> в правом верхнем углу! Они меняются при движении мыши и содержат много полезной информации! Для полной <f8bbd0|документации> с <f8bbd0|видео-туториалами>, пожалуйста, нажмите на <f8bbd0|вопросительный знак>.
TutorialMessages_9=(10/10) Заходите к нам в <f8bbd0|Discord>! Там вы найдёте других пользователей и сможете поделиться своими творениями! Ссылка есть в документации.

# Mobile
TutorialMessages_0_Mobile=(1/10) Добро пожаловать в <f8bbd0|KiraStudio>! Давайте уделим пару секунд на рассмотрение базового функционала, чтобы вы могли использовать приложение на все сто процентов.
TutorialMessages_1_Mobile=(2/10) Для <f8bbd0|перемещения> в различных окнах просто <f8bbd0|свайпните> в нужном месте.
TutorialMessages_2_Mobile=(3/10) Для <f8bbd0|масштабирования> в большинстве окон, <f8bbd0|сдвигайте и раздвигайте два пальца>.
TutorialMessages_3_Mobile=(4/10) Для <f8bbd0|добавления> вещей вроде паттернов и нот, <f8bbd0|нажмите> по пустому пространству.
TutorialMessages_4_Mobile=(5/10) Для <f8bbd0|выделения> вещей вроде паттернов и нот, <f8bbd0|коснитесь и держите палец на экране>, пока не увидите <f8bbd0|пульсирующий круг>, после чего <f8bbd0|начните двигать ваш палец>.
TutorialMessages_5_Mobile=(6/10) <f8bbd0|Долгое нажатие> на большинство вещей откроет <f8bbd0|контекстное меню> с дополнительными опциями. Попробуйте это на всём, что видите, чтобы узнать приложение получше!
TutorialMessages_6_Mobile=(7/10) <f8bbd0|Долгое нажатие> на большинство ползунков с числами позволит <f8bbd0|автоматизировать их различными способами>.
TutorialMessages_7_Mobile=(8/11) Кстати говоря про <f8bbd0|слайдеры>, вы можете переключиться на <f8bbd0|точную прокрутку> для бóльшей точности, если <f8bbd0|переместите палец за пределы ползунка> пока меняете его значение.
TutorialMessages_8_Mobile=(9/11) Для полной <f8bbd0|документации> с <f8bbd0|видео-туториалами>, пожалуйста, нажмите на <f8bbd0|вопросительный знак>.
TutorialMessages_9_Mobile=(10/11) Использование <f8bbd0|Bluetooth>-аудиоустройств сильно увеличивает <f8bbd0|задержку звука> К сожалению, приложение с этим ничего не может сделать. Рекомендуется использовать проводные наушники и/или колонки.
TutorialMessages_10_Mobile=(11/11) Заходите к нам в <f8bbd0|Discord>! Там вы найдёте других пользователей и сможете поделиться своими творениями! Ссылка есть в документации.

