FollowRangeTooltip=Seleciona a ponta direita da área à qual a barra de seguimento será restrita no modo seguir 'contínuo'. Isso também se aplica durante a gravação.
OscilloscopeScaleTooltip=Escala da forma de onda do osciloscópio na barra de ferramentas. Uma escala de 100% significa que qualquer valor fora da caixa resulta em clipping.

