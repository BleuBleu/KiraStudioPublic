# Sound tooltips
AudioBufferSizeTooltip=Tamanho do buffer de áudio interno. Isto e a opção 'Quadros emulados no buffer' ambas afetam a latência do áudio e podem ser ajustadas para evitar cortes no áudio.\n\nEm algumas plataformas, o sistema operacional pode limitar esse valor para o tamanho mínimo suportado pelo hardware, então você pode notar esta configuração não funcionar abaixo de um certo ponto.
MultithreadedRenderingTooltip=Se ativado, o aplicativo armazenará o áudio antecipadamente em threads separadas, proporcionando melhor desempenho e multithreading, ao custo de maior latência.\n\nDesative se o seu sistema tiver bom desempenho de núcleo único, caso contrário, ative.
