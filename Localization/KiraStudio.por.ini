# General tooltips
LanguageTooltip=Linguagem usada através do app.\n\nEstas traduções são feitas pelos usuários, então algumas linhas que não foram atualizadas poderam aparecer em inglês.\n\nSe você quer nos ajudar a traduzir o KiraStudio, vem ver a gente no Discord!
CheckUpdatesTooltip=Quando ativado, KiraStudio buscará atualizações toda vez que iniciar o aplicativo.
ShowTutorialTooltip=Quando ativado, o tutorial inicial será mostrado na próxima vez que iniciar o aplicativo.
ClearUndoRedoTooltip=Quando ativado, a pilha de desfazer/refazer será limpada toda vez que salvar. Desativar isto pode ajudar a manter o uso de memória baixo.
ReviewAfterPlayTooltip=Quando ativado, KiraStudio voltará para a última posição de reprodução depois de parar a música.
OpenLastTooltip=Quando ativado, KiraStudio abrirá o último projeto em que estava trabalhando antes de fechar o app.
AutosaveTooltip=Quando ativado, uma cópia do seu projeto será salva a cada 2 minutos, aproximadamente. Isso pode prevenir a perda de dados após uma falha.
